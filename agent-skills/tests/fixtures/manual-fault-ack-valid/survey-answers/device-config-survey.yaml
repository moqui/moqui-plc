        parent_rule_id: ""
        device_config_id: "CFG_PROCESS_PID_REACTOR"
        target_device_id: "REACTOR_CC"
        rule_type_enum_id: "DrtApplyConfig"
        rule_name: "Apply Reactor Concentration PID Startup Config"
        priority: 10
        run_device: false
        service_name: ""
        status_id: ""
        status_flow_id: ""
        notes: >-
          Binds the ProcessPid startup tuning plus the high-concentration
          threshold to REACTOR_CC. deviceTypeEnumId compatibility:
          REACTOR_CC and CFG_PROCESS_PID_REACTOR both use DtMoquiPlcProcessPID.
    notes: "Single-device ruleset; only one DeviceConfig/DeviceRule needed for this system."
