    notes: >-
      Full ProcessPid configRecipe surface plus the supervisory high-
      concentration threshold (folded into this same config, bound to
      REACTOR_CC). Tuned values: setpoint=1.117 gmol/liter (Case 1
      steady-state operating point from the source material),
      outputMin/outputMax=0.1714/0.9714 min^-1 (Fs/V=0.5714 +/- 0.4 min^-1,
      the source material's explicit manipulated-variable excursion limit),
      concentrationBHighThreshold=1.2 gmol/liter (developer-confirmed
      margin below the ~1.266 gmol/liter theoretical maximum). gain=1.0 and
      integrationTime=2.0 minutes are the source material's own stated
      nominal starting case for tuning-parameter sensitivity discussion,
      used here as a documented starting point that still requires field
      tuning (or the Ziegler-Nichols/simulation-based design the source
      material describes), not a derived/validated design. derivationTime=0
      (P/PI case, matching that same nominal reference). deviationInversion=N
      because Case 1 has positive process gain (increasing dilution rate
      increases C_B near this operating point per the source material), so
      deviation=setpoint-feedback (not inverted) gives the correct
      direct-acting sense. setpointFreezeEnable/outputFreezeEnable start at
      N; both are overridden dynamically every scan by the Main FSM output
      function.
