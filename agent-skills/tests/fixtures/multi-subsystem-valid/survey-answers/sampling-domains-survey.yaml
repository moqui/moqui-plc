domains:
  - domain_id: FAST_CTRL
    domain_name: Fast Control
    natural_frequency_class: fast
    scan_time: T#50ms
    transport_scope: control
    devices:
      - CONVEYOR_MOTOR
      - UV_LAMP_BANK
    signals:
      - SIG_CONVEYOR_ENABLE
      - SIG_LAMP_ENABLE
    notes: ""
  - domain_id: FAST_FB
    domain_name: Fast Feedback
    natural_frequency_class: fast
    scan_time: T#50ms
    transport_scope: monitoring
    devices:
      - UV_LAMP_BANK
    signals:
      - SIG_LAMP_READY
    notes: ""
