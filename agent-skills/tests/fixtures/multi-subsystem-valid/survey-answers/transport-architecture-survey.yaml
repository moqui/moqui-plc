transport_architecture:
  primary_transport_mode: gateway
  allows_hybrid_projection: false
  notes: Gateway-only projection for a multi-subsystem cell.
gateway_projection:
  required: true
  rationale: The edge gateway owns request restoration and runtime transport.
gateway_transports:
  - transport_id: MQTT_CELL
    gateway_device_id: GW_EDGE_CURE_01
    protocol: mqtt
    broker_uri: paho-mqtt5:?brokerUrl=tcp://artemis:1883&qos=1
    scoped_domain_ids: [FAST_CTRL, FAST_FB]
    supports_plc_logs: true
    plc_log_topic: moqui-plc
    supports_live_parameters: true
    live_parameter_topic: moqui/cure/parameters/live
    notes: Persistent MQTT v5 transport through Artemis.
plc4j_projection:
  required: false
  default_run_service_name: moqui.plc4j.Plc4jServices.run#Plc4jRequest
  connection_strategy: ""
  notes: ""
