naming_rules:
  positive_logic_default: true
  input_prefix: I_
  output_prefix: Q_
  analog_suffix: _A
  digital_suffix: _D
  notes: ""
signals:
  - signal_id: SIG_CONVEYOR_ENABLE
    device_id: CONVEYOR_MOTOR
    signal_name: conveyorEnable
    direction: output
    signal_kind: digital
    iec_type: BOOL
    source_rule: SA-NO actuation
    reverse_logic: false
    notes: ""
  - signal_id: SIG_LAMP_ENABLE
    device_id: UV_LAMP_BANK
    signal_name: lampEnable
    direction: output
    signal_kind: digital
    iec_type: BOOL
    source_rule: SA-NO actuation
    reverse_logic: false
    notes: ""
  - signal_id: SIG_LAMP_READY
    device_id: UV_LAMP_BANK
    signal_name: lampReady
    direction: input
    signal_kind: digital
    iec_type: BOOL
    source_rule: readiness feedback
    reverse_logic: false
    notes: ""
