    parent_fsm_id: ""
    application_id: CureApplication
    call_sequence: 20
    enable_condition: "TRUE"
    code_generation_approved: true
    states:
      - status_id: CmIdle
        name: Idle
        initial: true
        sequence: 1
        outputs_reviewed: true
      - status_id: CmObserve
        name: Observe
        initial: false
        sequence: 2
        outputs_reviewed: true
