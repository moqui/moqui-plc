# Transport architecture survey
transport_architecture:
  primary_transport_mode: "gateway"
  allows_hybrid_projection: false
  notes: >-
    Single continuous control loop. MQTT via moqui-device-gateway only,
    same convention as tank-level-control-001.
gateway_projection:
  required: true
  rationale: "C_B setpoint live-write via MqttParameterSub, plus standard framework device/fault log publication via LogDispatcher."
gateway_transports:
  - transport_id: "MQTT_MAIN"
    gateway_device_id: "REACTOR_GATEWAY"
    protocol: "mqtt"
    broker_uri: "paho-mqtt5:?brokerUrl=tcp://localhost:1883&qos=1"
    connection_name: ""
    driver_enum_id: ""
    transport_enum_id: ""
    transport_config: ""
    options: ""
    scoped_domain_ids: ["FAST"]
    supports_plc_logs: true
    plc_log_topic: "moqui-plc"
    supports_live_parameters: true
    live_parameter_topic: "moqui/isothermal-reactor/parameters/live"
    notes: "Development broker URI, no credentials embedded, same convention as tank-level-control-001."
plc4j_projection:
  required: false
  default_run_service_name: "moqui.plc4j.Plc4jServices.run#Plc4jRequest"
  connection_strategy: ""
  notes: "Not used for this system."
plc4j_connections: []
