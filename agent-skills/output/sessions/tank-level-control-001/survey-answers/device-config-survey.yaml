    notes: >-
      Full ProcessPid configRecipe surface plus the two supervisory alarm
      thresholds (folded into this same config since both are recipe values
      bound to TANK_LC; the thresholds are not literal ProcessPid FB inputs,
      just parameters carried on the same device for convenience). Tuned
      values confirmed by the developer: gain=10, integrationTime=60s,
      derivationTime=2s, setpoint=50%, outputMin/Max=0/100,
      levelLowLowThreshold=5%, levelHighHighThreshold=95%.
      atSetpointHysteresis=2% is an untuned starting value (status-only
      field, low risk) flagged for field tuning. deviationInversion=N
      because deviation=setpoint-feedback (not inverted) already gives the
      correct direct-acting sense: feedback below setpoint increases the
      output, opening the inlet valve. setpointFreezeEnable/
      outputFreezeEnable start at N; both are overridden dynamically every
      scan by the Main FSM output function, so their static recipe value
      only applies before the very first scan.
