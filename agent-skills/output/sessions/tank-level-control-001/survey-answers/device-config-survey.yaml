    rule_set_name: "Tank Level Control Startup Recipe"
    rules:
      - device_rule_id: "DR_TANK_LC_APPLY_PID_CONFIG"
        parent_rule_id: ""
        device_config_id: "CFG_PROCESS_PID_TANK_LEVEL"
        target_device_id: "TANK_LC"
        rule_type_enum_id: "DrtApplyConfig"
        rule_name: "Apply Tank Level PID Startup Config"
        priority: 10
        run_device: false
        service_name: ""
        status_id: ""
        status_flow_id: ""
        notes: >-
          Binds the ProcessPid startup tuning (gain=10, Ti=60s, Td=2s,
          setpoint=50%) plus the LL/HH alarm thresholds to TANK_LC.
          deviceTypeEnumId compatibility: TANK_LC and
          CFG_PROCESS_PID_TANK_LEVEL both use DtMoquiPlcProcessPID.
    notes: "Single-device ruleset; only one DeviceConfig/DeviceRule needed for this system."
