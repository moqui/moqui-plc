# PLC FSM topology and state-output survey. Prefer independent flat FSMs per system/subsystem.
fsms:
  - fsm_id: ""
    owner_subsystem_id: ""
    component_name: ""
    status_flow_id: ""
    status_type_id: ""
    composition: flat
    parent_fsm_id: ""
    application_id: ""
    call_sequence: 0
    enable_condition: "TRUE"
    completion_condition: ""
    fault_status_id: ""
    code_generation_approved: false
    states:
      - status_id: ""
        name: ""
        initial: true
        sequence: 1
        activate:
          device_groups: []
          physical_devices: []
          request_flags: []
        deactivate:
          device_groups: []
          physical_devices: []
          request_flags: []
        consume_transition_requests: []
        output_assignments: []
        outputs_reviewed: false
        notes: ""
    notes: ""
