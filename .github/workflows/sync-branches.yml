name: Sync main and master

on:
  push:
    branches:
      - main
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync pushed branch to the other
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET=master
          else
            TARGET=main
          fi

          git push origin "origin/${{ github.ref_name }}:refs/heads/$TARGET" --force-with-lease
